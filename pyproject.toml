[project]
name = "notes-chat"
version = "0.1.0"
description = "Notes Chat: Chat with your notes"
readme = "README.md"
authors = [
    { name = "Diaa J", email = "ditek@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.5",
    "fastapi>=0.115",
    "huggingface-hub>=0.27",
    "langchain>=0.3",
    "langchain-chroma>=0.2",
    "langchain-huggingface>=0.2",
    "langchain-text-splitters>=0.3",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "streamlit>=1.64.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

