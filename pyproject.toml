[project]
name = "notes-chat"
version = "0.1.0"
description = "Notes Chat: Chat with your notes"
readme = "README.md"
authors = [
    { name = "Diaa J", email = "ditek@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.5",
    "fastapi>=0.115",
    "langchain>=0.3",
    "langchain-chroma>=0.2",
    "langchain-huggingface>=0.2",
    "langchain-text-splitters>=0.3",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "sentence-transformers>=3.0",
    # Compatibility with the final Intel macOS PyTorch wheel.
    "sentence-transformers<4; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "transformers<4.50; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.2",
    "streamlit>=1.64.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pre-commit>=4.4",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64' and python_version == '3.10'"]

# Linux deployments install CPU wheels without CUDA libraries.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

