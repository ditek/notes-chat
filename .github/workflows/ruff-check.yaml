name: Ruff
on: pull_request

jobs:
  ruff_check:
    name: Ruff check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repo checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install development dependencies
        run: uv sync --locked --only-dev

      - name: Check lint
        run: uv run --locked --only-dev ruff check --output-format github .

      - name: Check formatting
        run: uv run --locked --only-dev ruff format --check .
