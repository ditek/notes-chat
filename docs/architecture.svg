  <title
     id="diagram-title">Chatty Notes — RAG architecture</title>
  <desc
     id="diagram-desc">Three-stage flow. Documents are chunked, embedded locally using MiniLM, and stored in Chroma. A user's question and conversation history are optionally rewritten, then embedded with the same model for top-k similarity search in Chroma. Retrieved passages are sent to a Groq-hosted chat model, which produces an answer. Retrieved source passages and metadata are displayed alongside it.</desc>
